    function getCategoryIcon(name) {
        name = name.toLowerCase();
        if (name.includes('shoe') || name.includes('sneaker') || name.includes('loafer') || name.includes('sandal') || name.includes('heel') || name.includes('pump')) return 'footprint';
        if (name.includes('necklace') || name.includes('earring') || name.includes('bracelet') || name.includes('watch') || name.includes('belt') || name.includes('bag') || name.includes('stole')) return 'diamond';
        if (name.includes('jean') || name.includes('pant') || name.includes('trouser') || name.includes('skirt') || name.includes('short') || name.includes('chino') || name.includes('salwar')) return 'apparel';
        return 'checkroom';
    }

    function setPersona(key) {
        try { localStorage.setItem('fc_demo_persona', key); } catch(e) { window.name = key; }
        render(key);
    }
    
    function getPersona() {
        try { return localStorage.getItem('fc_demo_persona') || 'isha'; } catch(e) { return window.name || 'isha'; }
    }

    function render(key) {
        const persona = data.personas.find(p => p.key === key) || data.personas[0];
        document.getElementById('header-title').innerText = persona.name + "'s closet";
        
        const tabs = document.getElementById('persona-tabs');
        tabs.innerHTML = '';
        data.personas.forEach((p) => {
            const active = p.key === key;
            const btn = document.createElement('button');
            btn.className = `flex-1 py-2 px-3 rounded-lg flex items-center justify-center gap-2 font-label-lg text-label-lg transition-colors min-h-[48px] ${active ? 'bg-ink text-white' : 'bg-surface text-ink-secondary'}`;
            btn.onclick = (e) => { e.stopPropagation(); setPersona(p.key); };
            btn.innerHTML = active ? `<span class="material-symbols-outlined text-[16px]">check</span> ${p.name}` : `${p.name}`;
            tabs.appendChild(btn);
        });
        
        document.getElementById('stat-items').innerText = persona.items;
        document.getElementById('stat-outfits').innerText = persona.outfits;
        document.getElementById('blurb').innerText = persona.blurb;
        document.getElementById('goes-with').innerText = `Goes with ${persona.goesWith.count}`;
        document.getElementById('goes-with-item').innerText = persona.goesWith.item;
        
        const grid = document.getElementById('item-grid');
        grid.innerHTML = '';
        const items = key === 'isha' ? data.wardrobeAlt : data.wardrobe;
        
        let itemsWithWears = items.map(item => ({...item, wears: item.wears || 0})).sort((a,b) => a.wears - b.wears);
        const barelyWornIds = itemsWithWears.slice(0, 3).map(i => i.id);

        items.forEach(item => {
            const isBarely = barelyWornIds.includes(item.id);
            const div = document.createElement('div');
            div.className = "aspect-[3/4] bg-surface-container-lowest rounded-md relative flex flex-col items-center justify-center border border-border shadow-soft overflow-hidden";
            
            let contentHTML = '';
            let pill = isBarely ? `<div class="absolute top-2 left-2 bg-gold-container text-ink font-label-md text-[10px] px-2 py-0.5 rounded-full z-20">Barely worn</div>` : '';
            
            if (data.imgMap[item.id]) {
                contentHTML = `<img src="${data.imgMap[item.id]}" alt="${item.name}" class="w-full h-full object-cover z-10" />`;
            } else {
                // Designed placeholder for Isha (or missing images)
                let icon = getCategoryIcon(item.name);
                contentHTML = `
                <div class="flex-grow w-full rounded flex flex-col items-center justify-center bg-surface p-2 gap-2 z-10">
                    <span class="material-symbols-outlined text-outline text-2xl">${icon}</span>
                    <div class="text-xs text-outline font-label-md text-center line-clamp-2">${item.name}</div>
                    <div class="w-3 h-3 rounded-full mt-1 border border-border shadow-soft" style="background-color: ${item.color || '#ccc'}"></div>
                </div>`;
            }
            
            div.innerHTML = pill + contentHTML;
            grid.appendChild(div);
        });
    }
    document.addEventListener('DOMContentLoaded', () => render(getPersona()));
</script>
