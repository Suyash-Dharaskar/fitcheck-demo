<script>
        document.querySelectorAll('main button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active classes from others
                document.querySelectorAll('main button').forEach(b => {
                    b.classList.remove('border-primary', 'bg-surface-container-lowest', 'shadow-soft');
                    b.classList.add('border-outline-variant/30');
                    const indicator = b.querySelector('.rounded-full div');
                    if(indicator) indicator.classList.add('hidden');
                    const radioCircle = b.querySelector('.rounded-full');
                    if(radioCircle) radioCircle.classList.remove('border-primary');
                    if(radioCircle) radioCircle.classList.add('border-outline-variant');
                });
                
                // Add to current if it's a language button (has a circle indicator)
                const radioCircle = this.querySelector('.rounded-full');
                if (radioCircle && !this.innerText.includes('more')) {
                    this.classList.add('border-primary');
                    this.classList.remove('border-outline-variant/30');
                    radioCircle.classList.add('border-primary');
                    radioCircle.classList.remove('border-outline-variant');
                    const indicator = this.querySelector('.rounded-full div');
                    if(indicator) indicator.classList.remove('hidden');
                }
            });
        });
    </script>
<script>
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');
        if (el && !el.getAttribute('onclick') && !el.getAttribute('href')) {
            e.preventDefault();
            let toast = document.createElement('div');
            toast.innerText = 'Not in this prototype';
            toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#201A28;color:white;padding:8px 16px;border-radius:999px;font-family:Mukta;font-size:13px;z-index:99999;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    });
    </script>
