<script id="merge-wiring">
(function () {
  var CHECK = '<div class="absolute top-2 right-2 z-10 w-6 h-6 bg-secondary rounded-full flex items-center justify-center shadow-soft" data-check><span class="material-symbols-outlined text-white text-[16px]" style="font-variation-settings: \'FILL\' 1;">check</span></div>';
  var SEL = 'main .h-48';
  var bar = document.getElementById('combine-bar');
  var label = bar.querySelector('span');
  var btn = bar.querySelector('button');
  function tiles() { return [].slice.call(document.querySelectorAll(SEL)); }
  function chosen() { return tiles().filter(function (t) { return t.classList.contains('border-primary'); }); }
  function sync() {
    var n = chosen().length;
    label.textContent = n + ' piece' + (n === 1 ? '' : 's') + ' selected';
    bar.hidden = n < 2;
    // `hidden` alone does not hide this bar: Tailwind's preflight sets
    // [hidden]{display:none} but the element carries `flex`, and a class beats
    // an attribute selector of equal specificity that came earlier. Measured
    // 2026-09-09 -- the bar sat at 54px reading "0 pieces selected" from load.
    // Set inline display too rather than touching shared CSS.
    bar.style.display = n < 2 ? 'none' : 'flex';
  }
  function bind(t) {
    t.addEventListener('click', function (e) {
      e.stopPropagation();
      var on = t.classList.toggle('border-primary');
      t.classList.toggle('border', on);
      if (on) { t.insertAdjacentHTML('afterbegin', CHECK); }
      else { var c = t.querySelector('[data-check], .bg-secondary.rounded-full'); if (c) { c.remove(); } }
      sync();
    });
  }
  tiles().forEach(bind);
  // A merged tile KEEPS the pieces it swallowed, detached but referenced, so
  // separating them again is one tap. The pieces were never fused -- the split
  // stage produced them separately and this gesture chose to join them -- so
  // there is nothing to reconstruct, only something not to throw away.
  var note = document.getElementById('pieces-note');
  var ORIGINAL_NOTE = note ? note.textContent : '';
  var UNDO = '<button type="button" data-unmerge class="absolute top-2 left-2 z-10 flex items-center gap-1 bg-surface text-on-surface-variant rounded-full pl-1.5 pr-2.5 py-1.5 font-label-lg text-label-lg text-[10px] shadow-soft"><span class="material-symbols-outlined text-[14px]">call_split</span>Separate</button>';
  // py-1.5 rather than py-0.5: measured at 20px tall, under WCAG 2.2 SC 2.5.8's
  // 24x24 minimum. 16px line-height + 6px top + 6px bottom = 28px.
  function merged() { return tiles().filter(function (t) { return t.pieces && t.pieces.length; }); }
  function renote() {
    if (!note) { return; }
    note.textContent = merged().length
      ? tiles().length + ' pieces, 6 items. Tap any two pieces to combine them.'
      : ORIGINAL_NOTE;
  }
  function unmerge(keep) {
    var ref = keep;
    (keep.pieces || []).forEach(function (t) { ref.insertAdjacentElement('afterend', t); ref = t; });
    var chips = keep.querySelector('.absolute.bottom-2');
    if (chips && typeof keep.chipsHtml === 'string') { chips.innerHTML = keep.chipsHtml; }
    var u = keep.querySelector('[data-unmerge]'); if (u) { u.remove(); }
    keep.pieces = null; keep.chipsHtml = null;
    renote();
    sync();
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var sel = chosen();
    if (sel.length < 2) { return; }
    var keep = sel[0];
    var extra = sel.slice(1);
    var chips = keep.querySelector('.absolute.bottom-2');
    // stash BEFORE mutating: the nodes survive removal while referenced, and
    // the chips text is the only other thing the merge overwrites.
    keep.pieces = (keep.pieces || []).concat(extra);
    if (typeof keep.chipsHtml !== 'string') { keep.chipsHtml = chips ? chips.innerHTML : ''; }
    extra.forEach(function (t) {
      t.classList.remove('border-primary', 'border');
      var x = t.querySelector('[data-check], .bg-secondary.rounded-full'); if (x) { x.remove(); }
      t.remove();
    });
    keep.classList.remove('border-primary', 'border');
    var c = keep.querySelector('[data-check], .bg-secondary.rounded-full'); if (c) { c.remove(); }
    if (chips) { chips.innerHTML = '<span class="font-label-lg text-label-lg text-on-surface bg-white/90 backdrop-blur-sm px-2 py-0.5 rounded-full text-[10px]">Shoes</span>'; }
    if (!keep.querySelector('[data-unmerge]')) { keep.insertAdjacentHTML('afterbegin', UNDO); }
    renote();
    sync();
  });
  document.addEventListener('click', function (e) {
    var u = e.target.closest ? e.target.closest('[data-unmerge]') : null;
    if (!u) { return; }
    e.stopPropagation();
    e.preventDefault();
    var keep = u.closest(SEL);
    if (keep) { unmerge(keep); }
  }, true);

})();

<script>
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');

            e.preventDefault();
            let toast = document.createElement('div');
            toast.innerText = 'Not in this prototype';
            toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#201A28;color:white;padding:8px 16px;border-radius:999px;font-family:Mukta;font-size:13px;z-index:99999;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    });
