<style>
/* Blueprint 054. A rotated decorative image with an outward offset pushes this
   page 12-108px wider than the viewport. `body { overflow-x: hidden }` alone
   only propagates a clip to the viewport, which stops a desktop scrollbar but
   NOT touch-panning on iOS - the founder's phone scrolled this screen sideways.
   `clip` rather than `hidden`: hidden would make the root a scroll container and
   break `position: sticky` for any descendant. clip does not, and it also blocks
   programmatic scrollLeft. The bleed is deliberate design and is preserved. */
html { overflow-x: clip; }

<script class="cursor-pointer" onclick="window.parent.postMessage('value_intro_demo', '*')">
        // Simple interaction script to handle form submission simulation
        document.querySelector('footer button').addEventListener('click', function() {
            const selectedLanguage = document.querySelector('input[name="language"]:checked').value;
            console.log('Selected Language:', selectedLanguage);
            // In a real app, this would trigger navigation
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Setting up...';
            this.classList.add('opacity-80', 'pointer-events-none');
            
            setTimeout(() => {
                this.innerHTML = 'Continue <span class="material-symbols-outlined">arrow_forward</span>';
                this.classList.remove('opacity-80', 'pointer-events-none');
            }, 1000);
        });
    </script>
<script>
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');
        if (el && !el.getAttribute('onclick') && !el.getAttribute('href')) {
            e.preventDefault();
            let toast = document.createElement('div');
            toast.innerText = 'Not in this prototype';
            toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#201A28;color:white;padding:8px 16px;border-radius:999px;font-family:Mukta;font-size:13px;z-index:99999;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    });
    </script>
