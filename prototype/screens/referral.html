<p class="font-body-lg text-body-lg text-ink-secondary mb-xl max-w-[280px]">

            </p>
<!-- 4. Referral Code -->

</div>

<span class="material-symbols-outlined mr-sm">chat</span>
                Share on WhatsApp
            </button>
</div>
</main>
<!-- BottomNavBar (Suppressed intentionally as this is a transactional/focused flow with a Back button in top nav) -->
<!-- Although the prompt asked for standard 4-destination nav, the 'Semantic Shell' mandate strictly prohibits nav shell on task-focused pages with 'Back' actions. -->
<script>
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');
        if (el && !el.getAttribute('onclick') && !el.getAttribute('href')) {
            e.preventDefault();
            let toast = document.createElement('div');
            toast.innerText = 'Not in this prototype';
            toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#201A28;color:white;padding:8px 16px;border-radius:999px;font-family:Mukta;font-size:13px;z-index:99999;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    });
    </script>
