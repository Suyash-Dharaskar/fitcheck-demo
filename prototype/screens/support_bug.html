<!-- Floating Bubble Script for Interactivity -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute bg-white/20 rounded-full animate-ping';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.left = `${e.offsetX}px`;
                ripple.style.top = `${e.offsetY}px`;
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 1000);
            });
        });
    </script>
<script>
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');
        if (el && !el.getAttribute('onclick') && !el.getAttribute('href')) {
            e.preventDefault();
            let toast = document.createElement('div');
            toast.innerText = 'Not in this prototype';
            toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#201A28;color:white;padding:8px 16px;border-radius:999px;font-family:Mukta;font-size:13px;z-index:99999;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    });
    </script>
