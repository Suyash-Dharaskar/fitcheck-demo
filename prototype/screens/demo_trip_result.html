    function getCategoryIcon(name) {
        name = name.toLowerCase();
        if (name.includes('shoe') || name.includes('sneaker') || name.includes('loafer') || name.includes('sandal') || name.includes('heel') || name.includes('pump')) return 'footprint';
        if (name.includes('necklace') || name.includes('earring') || name.includes('bracelet') || name.includes('watch') || name.includes('belt') || name.includes('bag') || name.includes('stole')) return 'diamond';
        if (name.includes('jean') || name.includes('pant') || name.includes('trouser') || name.includes('skirt') || name.includes('short') || name.includes('chino') || name.includes('salwar')) return 'apparel';
        return 'checkroom';
    }

    // Resolve an item id ("w05" / "a10") to its record. Returns null if unknown.
    function itemById(id) {
        return wardrobe.find(i => i.id === id) || wardrobeAlt.find(i => i.id === id) || null;
    }

    // Human-readable name for an id. NEVER returns a bare id.
    function itemName(id) {
        const it = itemById(id);
        return it ? it.name : '';
    }

    // One thumbnail. size is 'lg' (96x144) or 'sm' (48x64).
    // Photo when imgMap has the id; otherwise the designed placeholder.
    function thumbHtml(id, size) {
        const it = itemById(id);
        const name = it ? it.name : '';
        const box  = size === 'lg' ? 'w-16 h-24' : 'w-12 h-16';
        const ic   = size === 'lg' ? 'text-lg'   : 'text-sm';
        const tx   = size === 'lg' ? 'text-[8px]' : 'text-[6px]';
        const url  = imgMap[id] || null;
        if (url) {
            return `<img src="${url}" alt="${name}" title="${name}" class="${box} object-cover rounded shadow-soft border border-border flex-shrink-0" />`;
        }
        const icon = getCategoryIcon(name);
        const hex  = (it && COLOR_HEX[it.color]) || '#EEE9F2';
        return `
        <div class="${box} flex flex-col items-center justify-center bg-surface-container-lowest rounded shadow-soft border border-border p-1 flex-shrink-0" title="${name}">
            <span class="material-symbols-outlined text-outline ${ic}">${icon}</span>
            <span class="${tx} text-outline text-center line-clamp-2 mt-1">${name}</span>
            <span class="w-2 h-2 rounded-full mt-1 border border-border" style="background:${hex}"></span>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        let p = getPersona();
        const personaObj = personas.find(x => x.key === p) || personas[0];
        
        let days = tripData[p].days;
        let c = document.getElementById('days');
        days.forEach((d, i) => {
            
            // Build thumbnails
            let thumbsHtmlList = d.thumbs.map(id => thumbHtml(id, 'sm'));
            
            c.innerHTML += `
            <div class="mb-6">
                <h3 class="font-headline-md text-ink mb-2">Day ${i+1} &middot; ${d.title}</h3>
                <div class="flex gap-2 overflow-x-auto no-scrollbar py-2">
                    ${thumbsHtmlList.join('')}
                </div>
            </div>`;
        });
        
        document.getElementById('left-behind').innerText = tripData[p].warn;
        
        let gender = (p === 'isha') ? "she" : "he";
        document.getElementById('going-text').innerText = `Where's ${gender} going?`;
    });
</script>
