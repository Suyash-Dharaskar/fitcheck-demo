<script>
        // Simple swipe interaction logic
        const card = document.getElementById('activeCard');
        const likeOverlay = document.getElementById('likeOverlay');
        const nopeOverlay = document.getElementById('nopeOverlay');
        const btnLike = document.getElementById('btnLike');
        const btnNope = document.getElementById('btnNope');
        
        let isDragging = false;
        let startX, currentX;
        
        const resetCard = () => {
            card.style.transform = '';
            card.classList.remove('dragging');
            likeOverlay.style.opacity = '0';
            nopeOverlay.style.opacity = '0';
        };

        const swipeOut = (direction) => {
            const x = direction === 'right' ? window.innerWidth : -window.innerWidth;
            card.style.transition = 'transform 0.4s ease-out';
            card.style.transform = `translateX(${x}px) rotate(${direction === 'right' ? 20 : -20}deg)`;
            setTimeout(() => {
                // In a real app, this would load the next card. 
                // For this prototype, we just reset it to simulate endless deck.
                resetCard();
            }, 400);
        };

        card.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            card.classList.add('dragging');
        });

        card.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            const deltaX = currentX - startX;
            const rotation = deltaX * 0.05;
            
            card.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;
            
            if (deltaX > 0) {
                likeOverlay.style.opacity = Math.min(deltaX / 150, 0.6);
                nopeOverlay.style.opacity = '0';
            } else {
                nopeOverlay.style.opacity = Math.min(Math.abs(deltaX) / 150, 0.6);
                likeOverlay.style.opacity = '0';
            }
        });

        card.addEventListener('touchend', (e) => {
            isDragging = false;
            card.classList.remove('dragging');
            
            const deltaX = currentX - startX;
            if (deltaX > 100) {
                swipeOut('right');
            } else if (deltaX < -100) {
                swipeOut('left');
            } else {
                resetCard();
            }
        });

        btnLike.addEventListener('click', () => swipeOut('right'));
        btnNope.addEventListener('click', () => swipeOut('left'));
    </script>
<script>
    document.addEventListener('click', function(e) {
        let el = e.target.closest('a, button');
        if (el && !el.getAttribute('onclick') && !el.getAttribute('href')) {
            e.preventDefault();
            let toast = document.createElement('div');
            toast.innerText = 'Not in this prototype';
            toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#201A28;color:white;padding:8px 16px;border-radius:999px;font-family:Mukta;font-size:13px;z-index:99999;opacity:0;transition:opacity 0.3s;';
            document.body.appendChild(toast);
            setTimeout(() => toast.style.opacity = '1', 10);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
    });
    </script>
